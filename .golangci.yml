version: "2"

linters:
  default: standard
  enable:
    - depguard
  settings:
    # 依存の向きのルール。app → db の逆流は「db が app の Storage を実装する」構造による
    # import cycle 禁止で既に防げているので、ここではそれで防げない分だけを書く。
    depguard:
      rules:
        entity:
          list-mode: lax
          files:
            - "**/internal/app/*/entity/**"
          deny:
            - pkg: github.com/kodaikumatani/grpc-cqrs-go/pkg/pb
              desc: entity は通信方式（pb）に依存しない
            - pkg: github.com/kodaikumatani/grpc-cqrs-go/internal
              desc: entity はこのリポジトリの他パッケージに依存しない

        usecase:
          list-mode: lax
          files:
            - "**/internal/app/*/command/**"
            - "**/internal/app/*/query/**"
          deny:
            - pkg: github.com/kodaikumatani/grpc-cqrs-go/pkg/pb
              desc: ユースケースは pb に依存しない（変換は handler の責務）
            - pkg: github.com/kodaikumatani/grpc-cqrs-go/internal/db
              desc: 永続化は Storage インターフェース越しに使う

        # command と query は互いに依存しない（CQRS）。
        # depguard の deny はワイルドカード不可なので、query を持つ機能ごとに書く。
        recipe-command:
          list-mode: lax
          files:
            - "**/internal/app/recipe/command/**"
          deny:
            - pkg: github.com/kodaikumatani/grpc-cqrs-go/internal/app/recipe/query
              desc: command は query に依存しない
        recipe-query:
          list-mode: lax
          files:
            - "**/internal/app/recipe/query/**"
          deny:
            - pkg: github.com/kodaikumatani/grpc-cqrs-go/internal/app/recipe/command
              desc: query は command に依存しない

        authz:
          list-mode: lax
          files:
            - "**/internal/authz/**"
          deny:
            - pkg: github.com/kodaikumatani/grpc-cqrs-go/pkg/pb
              desc: authz は pb に依存しない
            - pkg: github.com/kodaikumatani/grpc-cqrs-go/internal/db
              desc: tuple の永続化は authz.Storage 越しに使う

        db:
          list-mode: lax
          files:
            - "**/internal/db/**"
          deny:
            - pkg: github.com/kodaikumatani/grpc-cqrs-go/pkg/pb
              desc: db は pb に依存しない
            - pkg: github.com/kodaikumatani/grpc-cqrs-go/internal/app$
              desc: db は handler 層に依存しない
            - pkg: github.com/kodaikumatani/grpc-cqrs-go/internal/app/recipe$
              desc: db は handler 層に依存しない
            - pkg: github.com/kodaikumatani/grpc-cqrs-go/internal/app/user$
              desc: db は handler 層に依存しない
            - pkg: github.com/kodaikumatani/grpc-cqrs-go/internal/app/share$
              desc: db は handler 層に依存しない
