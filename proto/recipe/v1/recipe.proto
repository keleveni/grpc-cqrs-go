syntax = "proto3";

package recipe.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/kodaikumatani/grpc-cqrs-go/pkg/pb/recipe/v1;recipev1";

service RecipeService {
  rpc CreateRecipe(CreateRecipeRequest) returns (CreateRecipeResponse);
  rpc GetRecipe(GetRecipeRequest) returns (GetRecipeResponse);
  // 閲覧できるレシピ（public / manage 権限のある private / view 権限のある restricted）を新しい順に返す。
  rpc ListRecipes(ListRecipesRequest) returns (ListRecipesResponse);
  rpc UpdateRecipe(UpdateRecipeRequest) returns (UpdateRecipeResponse);
  rpc ChangeVisibility(ChangeVisibilityRequest) returns (ChangeVisibilityResponse);
}

enum Visibility {
  VISIBILITY_UNSPECIFIED = 0;
  VISIBILITY_PUBLIC = 1;
  VISIBILITY_PRIVATE = 2;
  VISIBILITY_RESTRICTED = 3;
}

message Recipe {
  string id = 1;
  string user_id = 2;
  string title = 3;
  string description = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  Visibility visibility = 7;
}

message CreateRecipeRequest {
  string title = 2 [(buf.validate.field).required = true];
  string description = 3 [(buf.validate.field).required = true];
}

message CreateRecipeResponse {
  string recipe_id = 1;
}

message GetRecipeRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetRecipeResponse {
  Recipe recipe = 1;
  User user = 2;
}

message User {
  string id = 1;
  string name = 2;
  string email = 3;
}

message ListRecipesRequest {
  // 1 ページの最大件数。0 なら 20 件。
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  // 前のレスポンスの next_page_token。最初のページは空。
  string page_token = 2;
}

message ListRecipesResponse {
  repeated Recipe recipes = 1;
  // 次のページを取得するためのトークン。次のページがなければ空。
  string next_page_token = 2;
}

message UpdateRecipeRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string title = 2 [(buf.validate.field).required = true];
  string description = 3 [(buf.validate.field).required = true];
}

message UpdateRecipeResponse {
  bool success = 1;
}

message ChangeVisibilityRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  Visibility visibility = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
}

message ChangeVisibilityResponse {
  bool success = 1;
}
